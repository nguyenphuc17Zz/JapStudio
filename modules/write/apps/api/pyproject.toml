[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Forward references in SQLAlchemy relationships are intentionally quoted
# and reference classes defined in sibling model modules.
"app/models/*.py" = ["UP037", "F821"]
# Autogenerated migrations follow Alembic's own style.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Field name \"register\" in .* shadows an attribute in parent \"BaseModel\":UserWarning",
]