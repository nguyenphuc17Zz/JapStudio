name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_japanese_writing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create test database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ai_japanese_writing_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Ruff check
        run: ruff check app tests alembic

      - name: Ruff format check
        run: ruff format --check app tests alembic

      - name: Run tests
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/ai_japanese_writing
          APP_ENV: test
          RATE_LIMIT_ENABLED: 'false'
        run: python -m pytest -q

      - name: Alembic upgrade on fresh database
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/ai_japanese_writing
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ai_japanese_writing_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          DATABASE_URL="mysql+aiomysql://root:root@127.0.0.1:3306/ai_japanese_writing_ci" alembic upgrade head
          DATABASE_URL="mysql+aiomysql://root:root@127.0.0.1:3306/ai_japanese_writing_ci" alembic current

  frontend:
    name: Frontend (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build